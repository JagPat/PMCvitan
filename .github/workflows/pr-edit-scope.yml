name: PR edit scope

# A PR body/title edit changes review-unit EVIDENCE (the size marker and the
# invariant matrix live in the body) but never the code, so it re-runs ONLY the
# dependency-free review-scope check against the fresh PR metadata. The five
# product jobs live in ci.yml and are keyed to code events
# (opened/synchronize/reopened) — one product battery per SHA. The fresh
# review-scope check run supersedes the prior one for the same SHA, so a body
# edit that removes required large-unit evidence flips the required check red.
# scripts/autonomous-ci-battery.test.mjs pins this split; the trusted
# default-branch owner re-evaluates all evidence before review promotion
# regardless (editing this PR-side workflow cannot bypass the merge boundary).

on:
  pull_request:
    types: [edited]

jobs:
  review-scope:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Review-unit scope and invariant preflight (PR metadata edit)
        run: node scripts/review-scope.mjs
