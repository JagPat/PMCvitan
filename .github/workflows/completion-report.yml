name: Completion report

# Owner decision 2026-10-08 (rule 10): every merged PR gets one report — hours from open to merge, Codex
# review rounds and changed lines — posted when it actually merges (a queued auto-merge included).
#
# Codex 4220431609 — the controller merges with the workflow token, and GitHub creates no run from an event
# that token causes: no `pull_request: closed` here, and no push-to-main CI. So besides a human merge's
# `closed`, this workflow SWEEPS after every controller run (`workflow_run` is created even then) and hourly:
# it reports every recent merge still missing one, and dispatches CI on `main` when `main`'s head has no CI
# run (scripts/completion-report.mjs `sweep`). Both duties are idempotent.
on:
  pull_request:
    types: [closed]
  workflow_run:
    workflows: [Autonomous review and merge]
    types: [completed]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write
  pull-requests: read
  statuses: read

concurrency:
  group: completion-report-sweep-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'sweep' }}
  cancel-in-progress: false

jobs:
  report:
    if: github.event_name != 'pull_request' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default-branch automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Post the completion report
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/completion-report.mjs
