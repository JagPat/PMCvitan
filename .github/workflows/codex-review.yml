name: Request Codex review

# WHY THIS EXISTS
#
# Codex's own bot states its trigger set:
#
#   Reviews are triggered when you
#   - Open a pull request for review
#   - Mark a draft as ready
#   - Comment "@codex review".
#
# The autonomous loop in docs/AUTONOMOUS_LOOP.md opens EVERY pull request as a DRAFT and marks it
# ready only after Codex has reviewed the current head. Those two rules deadlock: the first two
# triggers never fire for a draft, and nobody types the third. The loop stalls silently — the PR
# looks healthy, CI is green, and no review ever arrives.
#
# `synchronize` is also absent from that trigger set, so even a ready PR is NOT re-reviewed after a
# corrective push. That breaks the fix-forward half of the loop just as badly.
#
# This workflow closes both gaps by using the ONE trigger that works regardless of draft state: it
# comments "@codex review" naming the exact head SHA, once per head.
#
# WHO POSTS IT MATTERS — this is measured, not assumed. `@codex review` is a per-USER command: the
# author of the comment must have a Codex account connected to GitHub. Both identities were tried on
# real pull requests:
#
#   github-actions[bot] (GITHUB_TOKEN)  →  Codex replies "To use Codex here, create a Codex account
#                                          and connect to github." and does NOT review.   (PR #231)
#   JagPat (repository owner)           →  Codex acknowledges with 👀 and reviews.          (PR #230)
#
# So GITHUB_TOKEN is useless here. This job posts as a Codex-connected human using the
# CODEX_REVIEW_TOKEN secret (a fine-grained PAT with Pull requests: read & write). If that secret is
# absent the job SKIPS with an explanation rather than posting a request Codex will refuse — a
# refused request is worse than none, because the thread then shows an unanswered "@codex review"
# that looks like the loop is working.
#
# The Claude review sweep (docs/AUTONOMOUS_LOOP.md, "Review trigger chain") posts the same request
# under the owner's own credentials and is the backstop when the secret is unset or expired. The two
# paths are independent on purpose; neither is the single point of failure.
#
# Secrets are not exposed to `pull_request` runs from forks, so this path covers same-repository
# branches only — which is every branch the loop creates.

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: write
  contents: read

concurrency:
  # One request in flight per PR. A rapid second push supersedes the first — the newer head is the
  # only one worth reviewing.
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request:
    runs-on: ubuntu-latest
    steps:
      - name: Ask Codex to review the current head (once per head SHA)
        env:
          # A Codex-connected identity. GITHUB_TOKEN is deliberately NOT a fallback: Codex refuses
          # `@codex review` from github-actions[bot], so falling back would post a request that is
          # answered with a refusal and leave the thread looking like the loop ran.
          GH_TOKEN: ${{ secrets.CODEX_REVIEW_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "CODEX_REVIEW_TOKEN is not configured — skipping."
            echo "Codex only honours '@codex review' from a user with a connected Codex account, so a"
            echo "request from github-actions[bot] would be refused. Until the secret is set, the"
            echo "Claude review sweep is the only request path (docs/AUTONOMOUS_LOOP.md)."
            exit 0
          fi
          echo "PR #$PR head: $HEAD_SHA"

          # Already reviewed this exact head? Nothing to ask for.
          if gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
               --jq '.[] | select(.user.login=="chatgpt-codex-connector[bot]") | .commit_id' \
             | grep -Fxq "$HEAD_SHA"; then
            echo "Codex has already reviewed $HEAD_SHA. No request needed."
            exit 0
          fi

          # Already asked for this exact head? Do not spam the thread on every re-run.
          MARKER="<!-- codex-review-request: $HEAD_SHA -->"
          if gh api "repos/$REPO/issues/$PR/comments" --paginate --jq '.[].body' \
             | grep -Fq "$MARKER"; then
            echo "A review request for $HEAD_SHA already exists. Nothing to do."
            exit 0
          fi

          gh pr comment "$PR" --repo "$REPO" --body "$(printf '%s\n\n%s\n\n%s\n' \
            '@codex review' \
            "$MARKER" \
            "Automated request for head \`$HEAD_SHA\`. This pull request is intentionally a draft until the review on this exact head carries no blocking finding — see \`docs/AUTONOMOUS_LOOP.md\`.")"
          echo "Requested a Codex review for $HEAD_SHA."
