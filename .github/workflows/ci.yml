name: CI

# One workflow handles every PR event, so a completed CI run always wakes the
# trusted default-branch owner.
#
# `battery-plan` decides whether this exact head still needs the five product
# jobs: it skips a metadata-only body/title edit whose head already has real
# product runs, and launches when the merge result changed (a base retarget) or
# when the products never really ran. scripts/autonomous-ci-battery.test.mjs
# pins that design.
#
# `quality-gate` is the single required status: it depends on every job above
# and passes only when each is an explicit success or an explicit skip. A
# cancelled job — one that never reached a verdict — blocks.
#
# A path-based risk classifier was attempted here and withdrawn; see
# docs/reviews/pr-263-convergence.md for why, and what it would need to return.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

jobs:
  review-scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Review-unit scope and invariant preflight
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/review-scope.mjs

  # Cheap by construction: one checkout + one script (a single check-runs API
  # read); no dependency install, no database. Fails toward running products.
  battery-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
    outputs:
      run_products: ${{ steps.plan.outputs.run_products }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Decide whether this event needs the product battery
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/ci-battery-plan.mjs

  # The loop's own machinery. NOT gated on the classification: `docs/STATUS.md`
  # is parsed by the runner state machine, so even a Markdown-only change can
  # break these. They are seconds, not minutes.
  #
  # `lint:migrations` runs HERE rather than in `api`, and the reason is measured
  # rather than aesthetic. (1) This is the only REQUIRED job that is not gated on
  # `battery-plan.outputs.run_products`, so it runs on every SHA — including the
  # PR-body edits where the product jobs are skipped by design. A claim about
  # what the corpus contains that can be skipped is not a claim. (2) The check is
  # STATIC: no database, no build, no Prisma client. `api` carries
  # `timeout-minutes: 60` and a Postgres service this would not use, and putting
  # a pre-review check behind an hour-budgeted job delays exactly the feedback it
  # exists to give. (3) It is cheap: measured on this repository, all 91
  # migrations parse with PostgreSQL's own grammar in 1.4s.
  automation:
    needs: [review-scope]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migration readability
        run: pnpm lint:migrations
      - name: Autonomous review state tests
        run: pnpm test:automation

  web:
    needs: [review-scope, battery-plan]
    if: needs.battery-plan.outputs.run_products == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migration readability
        run: pnpm lint:migrations
      - name: Autonomous review state tests
        run: pnpm test:automation
      - name: Typecheck
        run: pnpm --filter web typecheck
      - name: Lint
        run: pnpm --filter web lint
      - name: Unit tests
        run: pnpm --filter web test
      - name: Build
        run: pnpm --filter web build

  e2e:
    needs: [review-scope, battery-plan]
    if: needs.battery-plan.outputs.run_products == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright Chromium
        # `--with-deps` runs `apt-get update`, and that fetch has no timeout of its own. When a
        # runner's Azure mirror Ign's and apt falls back to archive.ubuntu.com, it can stall
        # indefinitely — 33 and 36 minutes on the two attempts of one job (PR #370, 58b2d51),
        # against seconds for the identical command on a healthy runner. Bounded here so a bad
        # mirror costs one fast retry instead of the review round.
        #
        # Two further optimizations look obvious and are REFUTED by measurement. Do not re-open
        # either without new evidence. Measured on a healthy runner, PR #406 head 6d5fe1d,
        # run 32451957869, this job:
        #
        #     apt phase           10.0s    0 upgraded, 9 newly installed
        #     browser download     9.7s    293.5 MiB at 30.2 MiB/s
        #     pnpm cache restore   2.4s    109.6 MiB at 46.1 MiB/s  (in-job control)
        #
        # 1. Dropping `--with-deps`. The premise is sound as far as it goes: all 26 Chromium
        #    shared libraries are ALREADY on the ubuntu-latest image, every one reported
        #    "already the newest version". But the 9 packages apt does install are FONTS —
        #    fonts-ipafont-gothic, fonts-wqy-zenhei, fonts-unifont, fonts-tlwg-loma-otf,
        #    xfonts-cyrillic and friends. Whether this suite renders correctly without them is
        #    a question about fonts that the library premise does not answer, and the web app
        #    ships en/hi/gu strings. The flag stays until a CI run answers it.
        #
        # 2. Caching ~/.cache/ms-playwright. apt and the download cost the same to within 3%
        #    (ratio 1.03), so the download is not the dominant half either. Against the pnpm
        #    store restored in the same job as the throughput control, a cache would save about
        #    3.3s of the 9.7s while adding a ~300 MB entry to the repository's shared cache
        #    budget that the pnpm store also draws on. Not worth it.
        timeout-minutes: 8
        run: pnpm --filter web exec playwright install --with-deps chromium
      - name: End-to-end tests
        run: pnpm --filter web test:e2e

  # Phase 0 acceptance gate: the two-project Playwright suite over the REAL
  # stack (NestJS + seeded PostgreSQL + the web app in API mode). Phase 0 is
  # complete only when this job is green — unit tests or the seeded demo alone
  # are insufficient evidence (docs/ROADMAP.md).
  api-e2e:
    needs: [review-scope, battery-plan]
    if: needs.battery-plan.outputs.run_products == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pmcvitan_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # a disposable database — scripts/test-api-e2e.sh wipes and reseeds it
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pmcvitan_e2e?schema=public
      JWT_SECRET: ci-api-e2e-secret-not-used-in-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build @vitan/shared (runtime package the API imports)
        run: pnpm build:shared
      - name: Prisma generate
        run: pnpm --filter api prisma:generate
      - name: Install Playwright Chromium
        # Bounded because `--with-deps` runs `apt-get update`, which has no timeout of its own
        # and has stalled for 30+ minutes on a bad mirror. The measured cost breakdown, and why
        # neither dropping `--with-deps` nor caching the browsers is worth taking, is recorded
        # once at the `e2e` job's copy of this step.
        timeout-minutes: 8
        run: pnpm --filter web exec playwright install --with-deps chromium
      # PR C Task 5 — the acceptance suite runs in BOTH sender modes over PostgreSQL 16, each on a
      # freshly migrated + seeded disposable database, proving the same user-visible consequences.
      - name: API acceptance — LEGACY sender mode (immediate dispatch; relay recovery on)
        run: pnpm test:e2e:api:legacy
      - name: API acceptance — OUTBOX sender mode (sealed cutover; background relay is sole sender)
        run: pnpm test:e2e:api:outbox
      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: api-e2e-traces
          path: apps/web/test-results/
          retention-days: 7

  # Phase 1 acceptance evidence (Task 7 Step 2): a legacy pre-Phase-1 database
  # is rebuilt from the real ledger, planted with representative legacy shapes,
  # upgraded through ALL Phase 1 migrations the way Prisma applies them, and
  # asserted to keep every legacy meaning intact. Pure psql — no build needed.
  upgrade-proof:
    needs: [review-scope, battery-plan]
    if: needs.battery-plan.outputs.run_products == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Upgraded-database proof (legacy fixture through all Phase 1 migrations)
        run: bash apps/api/scripts/upgrade-proof.sh

  api:
    needs: [review-scope, battery-plan]
    if: needs.battery-plan.outputs.run_products == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: pmcvitan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # a REAL disposable PostgreSQL (service above): migrations, constraints and
      # live-access behavior are exercised, not mocked
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/pmcvitan_test?schema=public
      JWT_SECRET: ci-integration-secret-not-used-in-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build @vitan/shared (runtime package the API imports)
        run: pnpm build:shared
      - name: Prisma generate
        run: pnpm --filter api prisma:generate
      - name: Apply migrations to the test database
        run: pnpm --filter api prisma:migrate
      - name: Unit tests
        run: pnpm --filter api test
      - name: Integration tests (real app over real PostgreSQL)
        run: pnpm --filter api test:integration
      - name: Typecheck
        run: pnpm --filter api typecheck
      - name: Build
        run: pnpm --filter api build
      # The ONLY job that executes the production `scripts/migrate.sh` P3005 baseline path.
      #
      # `upgrade-proof.sh` upgrades a LEDGER-BACKED database, which is a different path: it never
      # reaches the ALWAYS_EXECUTE handling that leaves a migration pending so its raw CHECKs and
      # triggers really run. Without this step a regression in that handling, or in
      # `20270930000000_schedule_dependency_graph`'s behaviour over a database that already has
      # "ActivityDependency", passes every required job while the reproduction it claims never
      # executes.
      #
      # The proof covers BOTH states that path can present — the table absent (every deployed
      # database: install the guards) and the table present (a `db push` shape: abort naming
      # docs/RUNBOOK.md §B1, then deploy after the documented repair) — and proves its own coupling
      # by mutating migrate.sh's ALWAYS_EXECUTE entry and requiring the guards not to arrive.
      #
      # A step in this job rather than a job of its own, deliberately: `api` already carries the
      # toolchain and the PostgreSQL service the proof needs and is already required by
      # `quality-gate`, so this costs no new wiring in the autonomous-loop job pins. The proof
      # builds its own scratch databases and never touches `pmcvitan_test`.
      #
      # That this step EXISTS, and that `quality-gate` needs this job, are pinned by
      # `scripts/ci-baseline-proof-wiring.test.mjs` in the required `automation` job — deleting the
      # step turns that job red instead of silently removing the only proof of the baseline path.
      - name: Schedule B1 baseline proof (the real migrate.sh over pre-baseline databases)
        timeout-minutes: 25
        run: bash apps/api/scripts/schedule-b1-baseline-proof.sh

  # The ONE required status.
  #
  # `always()` is load-bearing: without it a failing job would SKIP this gate,
  # and a skipped required check is not a failing one — the pull request would
  # sit forever rather than being refused. With it, every job's result reaches
  # `assessQualityGate`, which passes only on an explicit success or an explicit
  # skip. A cancelled job never reached a verdict and blocks.
  quality-gate:
    if: always()
    needs:
      - review-scope
      - battery-plan
      - automation
      - web
      - e2e
      - api
      - api-e2e
      - upgrade-proof
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Summarize every required check into one verdict
        env:
          JOB_RESULTS: ${{ toJSON(needs) }}
          RUN_PRODUCTS: ${{ needs.battery-plan.outputs.run_products }}
        run: node scripts/ci-quality-gate.mjs
