name: Autonomous review and merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to recover or bootstrap
        required: true
        type: number
      head_sha:
        description: Exact pull-request head SHA to recover
        required: true
        type: string
      terminal_status_id:
        description: Exact failed codex-current-head status ID authorizing this retry
        required: true
        type: string

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: autonomous-review-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.run_id }}-${{ github.event.workflow_run.head_sha || inputs.head_sha || github.run_id }}-${{ github.event_name == 'workflow_dispatch' && 'recovery' || 'ci' }}
  cancel-in-progress: false

jobs:
  orchestrate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out trusted default-branch automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Orchestrate CI, Codex review, and auto-merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          TERMINAL_STATUS_ID: ${{ inputs.terminal_status_id }}
          STATUS_CONTEXT: codex-current-head
        run: node scripts/autonomous-review-gate.mjs
