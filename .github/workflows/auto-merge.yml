name: Autonomous review and merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to recover or bootstrap
        required: true
        type: number

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write
  statuses: write

concurrency:
  group: autonomous-review-${{ github.event.workflow_run.pull_requests[0].number || github.event.pull_request.number || inputs.pr_number || github.run_id }}-${{ startsWith(github.event_name, 'pull_request_review') && github.run_id || github.event.workflow_run.head_sha || format('dispatch-{0}', github.run_id) }}
  cancel-in-progress: false

jobs:
  orchestrate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.event == 'pull_request' ||
      github.event_name == 'pull_request_review' ||
      github.event_name == 'pull_request_review_comment'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out trusted default-branch automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Orchestrate CI, Codex review, and auto-merge
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          STATUS_CONTEXT: codex-current-head
        run: node scripts/autonomous-review-gate.mjs
