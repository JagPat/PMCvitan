name: Autonomous review and merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to recover or bootstrap
        required: true
        type: number
      head_sha:
        description: Exact pull-request head SHA to recover
        required: true
        type: string
      terminal_status_id:
        description: Exact retryable failure or active pending codex-current-head status ID
        required: true
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  request-recovery:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default-branch automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Persist exact-head recovery request
        env:
          AUTONOMOUS_REVIEW_MODE: request-recovery
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: node scripts/autonomous-review-gate.mjs

  orchestrate:
    needs: [request-recovery]
    if: >-
      always() &&
      (
        github.event.workflow_run.event == 'pull_request' ||
        (
          github.event_name == 'workflow_dispatch' &&
          needs['request-recovery'].result == 'success'
        )
      )
    concurrency:
      group: autonomous-review-owner-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.run_id }}-${{ github.event.workflow_run.head_sha || inputs.head_sha || github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    # Terminal budget above the worst-case wait: 40m check settle + two 25m
    # review attempts + polling overhead. Derived from CHECK_TIMEOUT_MS /
    # REVIEW_TIMEOUT_MS in scripts/autonomous-review-gate.mjs — change together.
    timeout-minutes: 105
    steps:
      - name: Check out trusted default-branch automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Orchestrate CI, Codex review, and auto-merge
        env:
          AUTONOMOUS_REVIEW_MODE: orchestrate
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          STATUS_CONTEXT: codex-current-head
        run: node scripts/autonomous-review-gate.mjs
