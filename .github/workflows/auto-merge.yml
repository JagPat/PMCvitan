name: Auto-merge to main
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  pull_request_review:
    types: [submitted]
permissions:
  contents: write
  pull-requests: write
jobs:
  merge:
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - name: Enable auto-merge only once Codex has reviewed the current head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          HEAD_SHA=$(gh pr view "$PR" --repo "$REPO" --json headRefOid --jq .headRefOid)
          echo "Head commit: $HEAD_SHA"
          REVIEWS=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
            --jq '.[] | select(.user.login=="chatgpt-codex-connector[bot]") | .commit_id' || true)
          if ! printf '%s\n' "$REVIEWS" | grep -Fxq "$HEAD_SHA"; then
            echo "No Codex review for $HEAD_SHA. Leaving the pull request unmerged."
            exit 0
          fi
          echo "Codex has reviewed $HEAD_SHA. Queueing the merge."
          gh pr merge "$PR" --auto --squash --delete-branch --repo "$REPO"
