name: Autonomous review and merge

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  # The FALLBACK, not the driver.
  #
  # Every transition in this loop is event-driven and reacts the moment it
  # happens — the `workflow_run` trigger above is what actually moves units
  # along, and nothing waits on a tick to do work an event already announced.
  #
  # A declaration window is the single exception: its expiry is defined by the
  # ABSENCE of activity, so there is no event to react to. Nobody pushes, nobody
  # comments, nobody answers — and the deadline passes in silence. This sweep
  # exists for that case alone.
  #
  # Fifteen minutes because the shortest window is three hours, and noticing a
  # deadline an hour late wastes most of a fourth hour. The sweep does nothing
  # and writes nothing when no window has run out.
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to recover or bootstrap
        required: true
        type: number
      head_sha:
        description: Exact pull-request head SHA to recover
        required: true
        type: string
      terminal_status_id:
        description: Exact retryable failure or active pending codex-current-head status ID
        required: true
        type: string

permissions:
  actions: write
  contents: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  # Cheap by construction: one pull-request list plus one comment read per open
  # autonomous unit. It never decides anything — it re-dispatches the ordinary
  # gate for a unit whose window has run out, so the exact-head gate stays the
  # only authority and still fails closed.
  window-sweep:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
      pull-requests: read
      statuses: read
    steps:
      - name: Check out trusted default-branch automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Wake any unit whose declaration window has expired
        env:
          AUTONOMOUS_REVIEW_MODE: window-sweep
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/autonomous-review-gate.mjs

  request-recovery:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default-branch automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Persist exact-head recovery request
        env:
          AUTONOMOUS_REVIEW_MODE: request-recovery
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
        run: node scripts/autonomous-review-gate.mjs

  orchestrate:
    needs: [request-recovery]
    if: >-
      always() &&
      (
        github.event.workflow_run.event == 'pull_request' ||
        (
          github.event_name == 'workflow_dispatch' &&
          needs['request-recovery'].result == 'success'
        )
      )
    concurrency:
      group: autonomous-review-owner-${{ github.event.workflow_run.pull_requests[0].number || inputs.pr_number || github.run_id }}-${{ github.event.workflow_run.head_sha || inputs.head_sha || github.run_id }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out trusted default-branch automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Orchestrate CI, Codex review, and auto-merge
        env:
          AUTONOMOUS_REVIEW_MODE: orchestrate
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ inputs.pr_number }}
          STATUS_CONTEXT: codex-current-head
        run: node scripts/autonomous-review-gate.mjs
