name: Event-driven auto-merge disarm

# 2A3b-1 (notes/gate-codex-silent/2a3/2a3b-design.md). On the event that invalidates a queued merge, within seconds
# and not after CI, the gate disarms it from trusted default-branch code (it never checks out or runs PR code):
#  - a push to the pull request (its merge was queued for the old head);
#  - an arm by anyone but the gate, on a commit another open pull request shares (2A3a's one pull request per commit).
# Events this workflow token causes (the gate's own arm, drafts and stickies) never start a workflow run.
on:
  pull_request_target:
    types: [synchronize, auto_merge_enabled]

permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  disarm:
    if: github.event.pull_request.head.repo.full_name == github.repository
    # The controller's exact-head group: never racing the orchestrator on the same head
    concurrency:
      group: autonomous-review-owner-${{ github.event.pull_request.number }}-${{ github.event.pull_request.head.sha }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted default-branch automation
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Disarm a queued merge the event invalidated
        env:
          AUTONOMOUS_REVIEW_MODE: event-disarm
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/autonomous-review-gate.mjs
