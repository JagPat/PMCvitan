name: Phase 6 4d drain evidence (manual, read-only)

# The trusted producer of the record that clears `phase-6-4d-previous-release-drained` (docs/POLICY.md,
# the owner's choice of 2026-10-02). workflow_dispatch only, from the default branch only: it runs
# `rollout:drain-evidence` from this workflow's own commit against production — the Coolify inventory and
# the `ReleaseLease` register — with READ-ONLY credentials held in the `drain-evidence` environment, stamps
# the JSON with this run's identity, and uploads it as an artifact. It writes no status, comment, branch,
# setting or merge, and it drains, stops or deploys nothing.
#
# The clearance gate (scripts/autonomous-drain-clearance.mjs) admits a committed record only when its bytes
# equal this workflow's artifact from a successful run on `main`, so a hand-written record cannot clear the
# directive. To use it: run this workflow from the Actions tab on `main`, giving it the clearing PR's
# current head SHA; when it is green, download the artifact and commit its one file, unchanged, as
# docs/rollout/phase-6-4d-drain-evidence.json in ONE commit directly on top of that SHA, the commit that
# sets `blocking_directive: none` (RUNBOOK §P6T4D). Any other commit after it means running it again.
#
# Setup (the owner's, once): an environment named `drain-evidence` whose deployment branches are limited to
# `main`, holding the secrets DRAIN_DATABASE_URL (a read-only production role) and DRAIN_COOLIFY_TOKEN (a
# read-only Coolify token), and the variables DRAIN_COOLIFY_API_URL (`https://<coolify host>/api/v1`) and
# DRAIN_COOLIFY_APP_UUID. The production database must be reachable from GitHub-hosted runners.
on:
  workflow_dispatch:
    inputs:
      clearing_parent:
        description: The clearing PR's current head SHA (40 characters). Commit the artifact directly on top of it.
        required: true
        type: string

# No permissions by default; the single job reads its own checkout only.
permissions: {}

concurrency:
  group: drain-evidence
  cancel-in-progress: false

jobs:
  observe:
    # Trusted default branch only: a dispatch from any other ref is refused, and the environment's own
    # branch rule withholds its secrets from any other ref as well.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: drain-evidence
    permissions:
      contents: read
    steps:
      - name: Check out this workflow's own commit with full history (release ancestry)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build @vitan/shared
        run: pnpm build:shared
      - name: Prisma generate
        run: pnpm --filter api prisma:generate
      - name: Judge the drain against production (read-only)
        id: judge
        env:
          DATABASE_URL: ${{ secrets.DRAIN_DATABASE_URL }}
          COOLIFY_TOKEN: ${{ secrets.DRAIN_COOLIFY_TOKEN }}
          COOLIFY_API_URL: ${{ vars.DRAIN_COOLIFY_API_URL }}
          COOLIFY_APP_UUID: ${{ vars.DRAIN_COOLIFY_APP_UUID }}
          # passed through the environment, never interpolated into the script
          CLEARING_PARENT: ${{ inputs.clearing_parent }}
        run: node scripts/drain-evidence-workflow.mjs
      - name: Upload the stamped evidence
        if: always() && steps.judge.outputs.artifact_name != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.judge.outputs.artifact_name }}
          path: phase-6-4d-drain-evidence.json
          if-no-files-found: error
          retention-days: 30
      - name: Succeed only on a drained verdict
        if: steps.judge.outputs.verdict != 'drained'
        run: |
          echo "::error title=Not drained::the verdict is '${{ steps.judge.outputs.verdict }}'; this run's record cannot clear the directive"
          exit 1
